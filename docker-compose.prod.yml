# VPS overlay: a Cloudflare Tunnel is the only way in. cloudflared dials OUT to Cloudflare, so
# nothing here publishes a host port and the stack can share a server with other apps.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires DOMAIN and TUNNEL_TOKEN in .env, and the tunnel's public-hostname routes set up in
# the Cloudflare dashboard. See DEPLOY.md.

services:
  backend:
    # Reachable only through the tunnel.
    ports: !reset []
    environment:
      ENVIRONMENT: production
      # Cloudflare puts the visitor's IP last in X-Forwarded-For and cloudflared passes it
      # through unchanged: one trusted hop (for per-IP rate limits).
      TRUSTED_PROXY_COUNT: "1"
      FRONTEND_URL: https://${DOMAIN:?DOMAIN must be set in .env}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/google/callback
      CORS_ORIGINS: '["https://${DOMAIN}"]'

  frontend:
    ports: !reset []
    build:
      args:
        # Same origin: the SPA calls https://DOMAIN/api/v1/...
        VITE_API_URL: https://${DOMAIN}

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN must be set in .env}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
