[project]
name = "roast-news-backend"
version = "1.0.0"
description = "Roast News API - paste a news URL, get a Tanglish roast"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "T20", # flake8-print (no print())
    "S",   # flake8-bandit (security)
    "ASYNC",
    "SIM",
]
ignore = [
    "B008",   # FastAPI Depends() in default args is idiomatic
    "UP042",  # (str, Enum) is the deliberate pattern for SQLAlchemy/Pydantic enums
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]  # asserts, IP literals, fake secrets

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__init__.py"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/", "^alembic/"]
